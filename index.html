:root{color-scheme:dark;--bg:#0d0f15;--panel:#141824;--panel2:#1a1f2d;--raise:#212739;--line:#262d3f;--line2:#323a50;--text:#ece9e1;--dim:#a3a092;--faint:#6f6d68;--gold:#d8b46a;--gold2:#f3d79b;

*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--text);font:14.5px/1.5 "Segoe UI Variable Text","Segoe UI",Inter,system-ui,"Microsoft YaHei","Malgun Gothic","Yu Gothic UI",sans-serif}
a{color:inherit;text-decoration:none}button,input,select{font:inherit;color:inherit}
.top{position:sticky;top:0;z-index:20;background:rgba(13,15,21,.94);backdrop-filter:blur(8px);border-bottom:1px solid var(--line)}
.topin{max-width:1240px;margin:0 auto;padding:10px 20px;display:flex;gap:10px 18px;align-items:center;flex-wrap:wrap}
.brand{font-weight:800;font-size:19px;color:var(--gold2);white-space:nowrap}
nav{display:flex;gap:2px}nav a{padding:7px 13px;border-radius:8px;color:var(--dim);font-weight:600}nav a:hover{color:var(--text);background:var(--panel)}nav a.on{color:var(--gold2);background:var(--panel2)}

.gs::before{content:"⌕";position:absolute;left:12px;top:6px;color:var(--faint);font-size:17px}
.gs input:focus{outline:2px solid rgba(216,180,106,.45);border-color:var(--gold)}
.dd{position:absolute;left:0;right:0;top:calc(100% + 6px);background:var(--panel);border:1px solid var(--line2);border-radius:10px;box-shadow:0 18px 40px rgba(0,0,0,.5);max-height:70vh;overflow:auto;display:none}

 M.filter(counted).forEach(m=>{const by={};m.r.forEach(r=>{if(r[4]&&PW[r[4]])(by[r[4]]??=[]).push(r)});
  Object.entries(by).forEach(([role,rs])=>{if(rs.length<4)return;const w=PW[role];
   const sorted=w.map(([i])=>rs.map(r=>r[i]||0).sort((a,b)=>a-b));
   rs.forEach(r=>{let q=0;w.forEach(([i,x],j)=>{const a=sorted[j],v=r[i]||0;let lo=0;while(lo<a.length&&a[lo]<v)lo++;q+=x*(a.length>1?100*lo/(a.length-1):100)});
    r.q=q;const p=P.get(key(r[0]));if(p)p.par.push(q)})})});
 P.forEach(p=>{const a=p.par.slice().sort((x,y)=>x-y);p.pAvg=a.length?a.reduce((x,y)=>x+y,0)/a.length:null;p.pBest=a.length?a[a.length-1]:null;p.pMed=a.length?a[Math.floor((a.length-1)/2)]:null})}
const _build=build;build=function(){_build();parses()};build();
const topE=o=>Object.entries(o).sort((a,b)=>b[1]-a[1]);
const roleDot=r=>`<span class="dot" style="--c:var(--${r||"x"})"></span>`;
const pLink=(n,extra="")=>`<a href="${ROOT}#/player/${encodeURIComponent(key(n))}" class="nm">${esc(n)}</a>${extra}`;
const gLink=g=>g?`<a href="${ROOT}#/guild/${encodeURIComponent(g)}">${esc(g)}</a>`:"";
const mHref=m=>`${ROOT}m/${encodeURIComponent(m.id)}/`;
const dateTxt=m=>m.d?m.date.toLocaleDateString("en-US",{month:"short",day:"numeric",year:"numeric"}):"";
function sortable(cols,rows,state,render){ // cols:[key,label,cls,getter]
 const h=`<thead><tr>${cols.map(([k,l,c])=>`<th data-k="${k}" class="${c||""} ${state.k===k?"on":""}">${l}${state.k===k?(state.a?" ▴":" ▾"):""}</th>`).join("")}</tr></thead>`;
 const get=cols.find(c=>c[0]===state.k)[3];
 rows.sort((x,y)=>{const a=get(x),b=get(y);return(a<b?-1:a>b?1:0)*(state.a?1:-1)});
 return h}
function bindSort(el,state,rerender){el.querySelector("thead").onclick=e=>{const th=e.target.closest("th");if(!th)return;const k=th.dataset.k;if(k===state.k)state.a=!state.a;else{state.k=k;state.a=/^(name|guild|cls|t|map|n)$/.test(k)}rerender()}}

 $("#app").innerHTML=`<h1>Parses</h1><div class="sub">Each game, every player is ranked 0–100 against the others in the same role in that game:
 DPS on damage (60%), kills, assists · Support on healing (60%), assists, damage taken · Tank on damage taken, damage dealt, assists, kills.
 Colours: <span style="color:#9d9d9d">grey</span> &lt;25 · <span style="color:#1eff00">green</span> 25 · <span style="color:#3a8bff">blue</span> 50 · <span style="color:#a335ee">purple</span> 75 · <span style="color:#ff8000">orange</span> 95 · <span style="color:#e268a8">pink</span> 99 · <span style="color:#e5cc80">gold</span> 100.</div>
 <div class="bar" style="margin-top:14px"><input id="qq" type="search" placeholder="Player or guild…" value="${esc(QS.q)}">
 <select id="qr"><option value="">All roles</option>${["Tank","Support","DPS"].map(r=>`<option${QS.role===r?" selected":""}>${r}</option>`).join("")}</select>
 <select id="qc"><option value="">All classes</option>${classes.map(c=>`<option${QS.cls===c?" selected":""}>${esc(c)}</option>`).join("")}</select>
 <select id="qm">${[1,3,5,10].map(v=>`<option value="${v}"${QS.min==v?" selected":""}>${v}+ parsed games</option>`).join("")}</select>${inclBar()}</div>
 <div class="tw"><table id="qt"></table></div><div class="more" id="qmore"></div>`;
 const cols=[["name","Player","l",p=>p.n.toLowerCase()],["cls","Class","l",p=>p.cls||"~"],["g","Parsed games","",p=>p.par.length],["avg","Average","",p=>p.pAvg??-1],["med","Median","",p=>p.pMed??-1],["best","Best","",p=>p.pBest??-1],
  ["top","95+ games","",p=>p.par.filter(q=>q>=95).length]];
 const draw=()=>{const q=QS.q.trim().toLowerCase();
  const rows=[...P.values()].filter(p=>p.par.length>=QS.min&&(!QS.role||p.role===QS.role)&&(!QS.cls||p.cls===QS.cls)&&(!q||(p.n+" "+p.guild).toLowerCase().includes(q)));
  const h=sortable(cols,rows,QS.st);
  $("#qt").innerHTML=h+`<tbody>${rows.slice(0,QS.n).map(p=>`<tr class="go" data-k="${esc(p.k)}"><td class="l"><span class="nm">${esc(p.n)}</span><span class="g">${esc(p.guild)}</span></td>
  <td class="l">${roleDot(p.role)}${esc(p.cls)}</td><td>${p.par.length}</td><td>${pz(p.pAvg)}</td><td>${pz(p.pMed)}</td><td>${pz(p.pBest)}</td><td>${p.par.filter(q=>q>=95).length}</td></tr>`).join("")}</tbody>`;
  $("#qmore").innerHTML=rows.length>QS.n?`<button>Show more (${nf(rows.length-QS.n)} left)</button>`:rows.length?"":`<p class="empty">Nobody fits — try fewer games.</p>`;
  const mb=$("#qmore button");if(mb)mb.onclick=()=>{QS.n+=300;draw()};
  bindSort($("#qt"),QS.st,draw);$("#qt tbody").onclick=e=>{const tr=e.target.closest("tr[data-k]");if(tr)location.hash="#/player/"+encodeURIComponent(tr.dataset.k)}};
 $("#qq").oninput=e=>{QS.q=e.target.value;draw()};$("#qr").onchange=e=>{QS.role=e.target.value;draw()};$("#qc").onchange=e=>{QS.cls=e.target.value;draw()};
 $("#qm").onchange=e=>{QS.min=+e.target.value;draw()};bindIncl(vParses);draw()}

/* ---------------- search everywhere ---------------- */
const gq=$("#gq"),dd=$("#dd");let hits=[],sel=-1;
function search(q){q=q.trim().toLowerCase();if(!q){dd.classList.remove("on");return}
 const ps=[...P.values()].filter(p=>p.n.toLowerCase().includes(q)).sort((a,b)=>(a.n.toLowerCase().startsWith(q)?0:1)-(b.n.toLowerCase().startsWith(q)?0:1)||b.g-a.g).slice(0,8);
 const gs=[...G.values()].filter(g=>g.n.toLowerCase().includes(q)).sort((a,b)=>b.ms.size-a.ms.size).slice(0,5);
 const ms=M.filter(m=>(m.t+" "+m.map+" "+m.d).toLowerCase().includes(q)).sort((a,b)=>b.date-a.date).slice(0,6);
 hits=[...ps.map(p=>({h:`${ROOT}#/player/${encodeURIComponent(p.k)}`,t:p.n,s:`${p.cls||""} · ${p.guild||""} · ${p.g} games`,grp:"Players"})),
  ...gs.map(g=>({h:`${ROOT}#/guild/${encodeURIComponent(g.n)}`,t:g.n,s:`${g.ps.size} players · ${g.ms.size} matches`,grp:"Guilds"})),
  ...ms.map(m=>({h:mHref(m),t:m.t,s:dateTxt(m),grp:"Matches"}))];
 sel=-1;let last="";
 dd.innerHTML=hits.map((x,i)=>(x.grp!==last?`<h6>${(last=x.grp)}</h6>`:"")+`<a href="${esc(x.h)}" data-i="${i}">${esc(x.t)}<span>${esc(x.s)}</span></a>`).join("")||`<h6>Nothing found</h6>`;
 dd.classList.add("on")}
gq.oninput=()=>search(gq.value);gq.onfocus=()=>gq.value&&search(gq.value);
gq.onkeydown=e=>{const as=[...dd.querySelectorAll("a")];if(e.key==="ArrowDown"||e.key==="ArrowUp"){e.preventDefault();sel=Math.max(0,Math.min(as.length-1,sel+(e.key==="ArrowDown"?1:-1)));as.forEach((a,i)=>a.classList.toggle("k",i===sel))}
 else if(e.key==="Enter"){const a=as[sel>=0?sel:0];if(a){location.href=a.getAttribute("href");dd.classList.remove("on");gq.blur()}}else if(e.key==="Escape"){dd.classList.remove("on");gq.blur()}};
document.addEventListener("click",e=>{if(!e.target.closest(".gs"))dd.classList.remove("on");else if(e.target.closest(".dd a"))dd.classList.remove("on")});
document.addEventListener("keydown",e=>{if(e.key==="/"&&document.activeElement.tagName!=="INPUT"){e.preventDefault();gq.focus()}});

/* ---------------- router ---------------- */
function route(){const h=decodeURIComponent(location.hash.replace(/^#\/?/,""));const [v,...rest]=h.split("/");const arg=rest.join("/");
 const view=v||"matches";document.querySelectorAll("nav a").forEach(a=>a.classList.toggle("on",a.dataset.v===(view==="player"?"players":view==="guild"?"guilds":view)));
 if(view==="players")vPlayers();else if(view==="player")vPlayer(arg);else if(view==="guilds")vGuilds();else if(view==="guild")vGuild(arg);else if(view==="leaders")vLeaders();else if(view==="parses")vParses();else vMatches();
 document.title=(view==="player"&&P.get(arg)?P.get(arg).n+" · ":view==="guild"&&arg?arg+" · ":view==="leaders"?"Leaderboards · ":view!=="matches"&&view!==""?view[0].toUpperCase()+view.slice(1)+" · ":"")+D.title;
 window.scrollTo(0,0)}
addEventListener("hashchange",route);route();
</script></body></html>
