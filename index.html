const get=k=>{try{return sessionStorage.getItem(k)||localStorage.getItem(k)}catch(e){return null}};
async function open_(pw,remember){
  const base=await crypto.subtle.importKey("raw",new TextEncoder().encode(pw),"PBKDF2",false,["deriveKey"]);
  const key=await crypto.subtle.deriveKey({name:"PBKDF2",salt:b64(E.s),iterations:E.n,hash:"SHA-256"},base,{name:"AES-GCM",length:256},false,["decrypt"]);

  try{sessionStorage.setItem("ss_pw",pw);if(remember)localStorage.setItem("ss_pw",pw)}catch(e){}
  document.open();document.write(page);document.close();
}
