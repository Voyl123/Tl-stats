.dd a{display:flex;justify-content:space-between;gap:10px;padding:6px 12px;border-left:2px solid transparent}.dd a:hover,.dd a.k{background:#1e1e23;border-left-color:var(--acc)}.dd a span{color:var(--faint);font-size:12px;white-space:nowrap}
/* ---- page ---- */
main{max-width:1280px;margin:0 auto;padding:22px 18px 70px}
h1{margin:0 0 3px;font-size:26px;font-weight:700;color:#fff;letter-spacing:.005em;display:flex;align-items:center;flex-wrap:wrap;gap:4px}

.stat{flex:1 1 100px;padding:10px 16px;border-right:1px solid var(--line);min-width:110px;display:flex;flex-direction:column-reverse;justify-content:flex-end}
.stat:last-child{border-right:0}

.stat span{font-size:10.5px;color:var(--dim);text-transform:uppercase;letter-spacing:.09em;font-weight:700}

.bar{display:flex;gap:6px;flex-wrap:wrap;align-items:center;margin:0 0 12px;padding:8px;background:var(--bg2);border:1px solid var(--line);border-radius:3px}

.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(310px,1fr));gap:10px}
.card{display:block;position:relative;background:linear-gradient(180deg,#18181c,#131316);border:1px solid var(--line);border-radius:3px;padding:12px 14px 12px;transition:border-color .12s,transform .12s}

const $=s=>document.querySelector(s),esc=s=>String(s??"").replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const nf=n=>Number(n||0).toLocaleString("en-US"),sh=n=>{n=+n||0;const a=Math.abs(n);return a>=1e6?(n/1e6).toFixed(a>=1e7?1:2)+"M":a>=1e4?Math.round(n/1e3)+"K":a>=1e3?(n/1e3).toFixed(1)+"K":String(Math.round(n))};
const key=s=>String(s||"").toLowerCase().replace(/[\s\W_]+/gu,"");
const TY={war:"Wargame",inhouse:"Inhouse",siege:"Siege",merged:"Merged"};
const TC=t=>({Yellow:"var(--Yellow)",Red:"var(--Red)",Blue:"var(--Blue)",Green:"var(--Green)","My Team":"var(--Yellow)","Opposing Team":"var(--Red)"})[t]||"#9aa3b2";
// row: [name,guild,team,class,role,rank,kills,assists,dealt,taken,healed,(deaths)]
const M=D.m.map((m,i)=>({...m,i,date:new Date((m.d||"").replace(" ","T")),ym:(m.d||"").slice(0,7)}));
let incl={war:1,inhouse:0,siege:0,scan:1};
function counted(m){return m.ty==="merged"?false:m.ty==="war"?true:!!incl[m.ty]}
let P,G;
// guild history: players change guilds, so the current guild is the one from their latest game
function ghAdd(gh,g,m){if(!g)return;const d=m.d||"";const x=gh[g]??={n:0,f:d,l:d};x.n++;if(d<x.f)x.f=d;if(d>x.l)x.l=d}
const ghList=gh=>Object.entries(gh).sort((a,b)=>b[1].l.localeCompare(a[1].l)||b[1].n-a[1].n);
const latestG=gh=>ghList(gh)[0]?.[0]||"";
let build=function(){P=new Map();G=new Map();
 M.filter(counted).forEach(m=>m.r.forEach(r=>{const k=key(r[0]);if(!k)return;
  let p=P.get(k);if(!p){p={k,n:r[0],gs:{},gh:{},cs:{},rs:{},s:[0,0,0,0,0],b:[0,0,0,0,0],g:0,rk:0,rn:0,h:[],de:0,dg:0,dk:0};P.set(k,p)}
  if(r[11]!=null){p.de+=r[11];p.dg++;p.dk+=r[6]||0}
  ghAdd(p.gh,r[1],m);
  p.g++;p.gs[r[1]]=(p.gs[r[1]]||0)+1;if(r[3])p.cs[r[3]]=(p.cs[r[3]]||0)+1;if(r[4])p.rs[r[4]]=(p.rs[r[4]]||0)+1;
  for(let i=0;i<5;i++){p.s[i]+=r[6+i]||0;p.b[i]=Math.max(p.b[i],r[6+i]||0)}if(r[5]){p.rk+=r[5];p.rn++}p.h.push([m.i,r]);
  const gk=r[1]||"";if(gk){let g=G.get(gk);if(!g){g={n:gk,ps:new Set(),ms:new Set(),s:[0,0,0,0,0]};G.set(gk,g)}g.ps.add(k);g.ms.add(m.i);for(let i=0;i<5;i++)g.s[i]+=r[6+i]||0}}));
 P.forEach(p=>{const t=o=>Object.entries(o).sort((a,b)=>b[1]-a[1])[0]?.[0]||"";p.guild=latestG(p.gh)||t(p.gs);p.cls=t(p.cs);p.role=t(p.rs);p.avgRank=p.rn?p.rk/p.rn:null})}
const PW={DPS:[[8,.6],[6,.25],[7,.15]],Support:[[10,.6],[7,.3],[9,.1]],Tank:[[9,.35],[8,.3],[7,.2],[6,.15]]};
const pcol=q=>q>=100?"#e5cc80":q>=99?"#e268a8":q>=95?"#ff8000":q>=75?"#a335ee":q>=50?"#3a8bff":q>=25?"#1eff00":"#9d9d9d";
const pz=q=>q==null?"<span class=g>–</span>":`<span class="pz" style="color:${pcol(q)}">${Math.round(q)}</span>`;
// a game's parse: percentile against the same role in that game, weighted by what the role is for
function parses(){P.forEach(p=>{p.par=[]});
 M.filter(counted).forEach(m=>{const by={};m.r.forEach(r=>{if(r[4]&&PW[r[4]])(by[r[4]]??=[]).push(r)});
  Object.entries(by).forEach(([role,rs])=>{if(rs.length<4)return;const w=PW[role];
   const sorted=w.map(([i])=>rs.map(r=>r[i]||0).sort((a,b)=>a-b));
   rs.forEach(r=>{let q=0;w.forEach(([i,x],j)=>{const a=sorted[j],v=r[i]||0;let lo=0;while(lo<a.length&&a[lo]<v)lo++;q+=x*(a.length>1?100*lo/(a.length-1):100)});
    r.q=q;const p=P.get(key(r[0]));if(p)p.par.push(q)})})});
 P.forEach(p=>{const a=p.par.slice().sort((x,y)=>x-y);p.pAvg=a.length?a.reduce((x,y)=>x+y,0)/a.length:null;p.pBest=a.length?a[a.length-1]:null;p.pMed=a.length?a[Math.floor((a.length-1)/2)]:null})}
const _build=build;build=function(){_build();parses()};build();
const topE=o=>Object.entries(o).sort((a,b)=>b[1]-a[1]);
const roleDot=r=>`<span class="dot" style="--c:var(--${r||"x"})"></span>`;
const pLink=(n,extra="",g)=>{const p=P.get(key(n));g=g??(p?p.guild:"");return`<span class="pn"><a href="${ROOT}#/player/${encodeURIComponent(key(n))}" class="nm">${esc(n)}</a>${gTag(g)}</span>${extra}`};
const GI=D.gi||{};
const ghue=g=>{let h=0;for(const c of g)h=(h*31+c.codePointAt(0))%360;return h};
const gIcon=g=>!g?"":GI[g]?`<img class="ge" src="${GI[g]}" alt="">`:`<span class="ge gx" style="--h:${ghue(g)}">${esc([...g.replace(/[^\p{L}\p{N}]/gu,"")][0]||"?").toUpperCase()}</span>`;
const gLink=g=>g?`<a class="gl" href="${ROOT}#/guild/${encodeURIComponent(g)}">${gIcon(g)}${esc(g)}</a>`:"";
const gTag=g=>g?`<span class="g gt">${gIcon(g)}${esc(g)}</span>`:"";
const mHref=m=>`${ROOT}m/${encodeURIComponent(m.id)}/`;
const dateTxt=m=>m.d?m.date.toLocaleDateString("en-US",{month:"short",day:"numeric",year:"numeric"}):"";
function sortable(cols,rows,state,render){ // cols:[key,label,cls,getter]
 const h=`<thead><tr>${cols.map(([k,l,c])=>`<th data-k="${k}" class="${c||""} ${state.k===k?"on":""}">${l}${state.k===k?(state.a?" ▴":" ▾"):""}</th>`).join("")}</tr></thead>`;
 const get=cols.find(c=>c[0]===state.k)[3];
 rows.sort((x,y)=>{const a=get(x),b=get(y);return(a<b?-1:a>b?1:0)*(state.a?1:-1)});
 return h}
function bindSort(el,state,rerender){el.querySelector("thead").onclick=e=>{const th=e.target.closest("th");if(!th)return;const k=th.dataset.k;if(k===state.k)state.a=!state.a;else{state.k=k;state.a=/^(name|guild|cls|t|map|n)$/.test(k)}rerender()}}
function inclBar(){return`<div class="seg" id="inc" title="Which games count toward player and guild totals"><button data-t="inhouse" class="${incl.inhouse?"on":""}">+ Inhouses</button><button data-t="siege" class="${incl.siege?"on":""}">+ Sieges</button></div>`}
function bindIncl(re){document.querySelectorAll("#inc button").forEach(b=>b.onclick=()=>{incl[b.dataset.t]=incl[b.dataset.t]?0:1;build();re()})}

/* ---------------- matches ---------------- */
const MS={q:"",ty:"",g:"",map:"",sort:"new",pick:false,sel:new Set()};
function vMatches(){
 const guilds=[...new Set(M.flatMap(m=>Object.values(m.tm).flatMap(t=>t[0].split(" + "))).filter(Boolean))].sort((a,b)=>a.localeCompare(b));
 const maps=[...new Set(M.map(m=>m.map).filter(Boolean))].sort();
 const war=M.filter(m=>m.ty!=="merged");
 $("#app").innerHTML=`<h1>Matches</h1><div class="sub">Updated ${esc(D.updated)}</div>
 <div class="stats"><div class="stat"><b>${nf(war.length)}</b><span>matches</span></div><div class="stat"><b>${nf(P.size)}</b><span>players</span></div>
 <div class="stat"><b>${nf(G.size)}</b><span>guilds</span></div><div class="stat"><b>${nf(war.reduce((a,m)=>a+m.r.reduce((x,r)=>x+(r[6]||0),0),0))}</b><span>kills recorded</span></div></div>
 <div class="bar"><input id="mq" type="search" placeholder="Filter by title, map, guild or player…" value="${esc(MS.q)}">
 <div class="seg" id="mty">${[["","All"],["war","Wargames"],["inhouse","Inhouses"],["siege","Sieges"],["merged","Merged"]].map(([v,l])=>`<button data-v="${v}" class="${MS.ty===v?"on":""}">${l}</button>`).join("")}</div>
 <select id="mg"><option value="">Any guild</option>${guilds.map(g=>`<option${g===MS.g?" selected":""}>${esc(g)}</option>`).join("")}</select>
 <select id="mm"><option value="">Any map</option>${maps.map(g=>`<option${g===MS.map?" selected":""}>${esc(g)}</option>`).join("")}</select>
 <button class="btn2${MS.pick?" on":""}" id="mpick" title="Tick matches and merge them into one leaderboard">${MS.pick?"Done picking":"Merge games…"}</button>
 <select id="ms"><option value="new">Newest first</option><option value="old"${MS.sort==="old"?" selected":""}>Oldest first</option><option value="kills"${MS.sort==="kills"?" selected":""}>Most kills</option></select></div>
 <div id="ml"></div>`;
 const draw=()=>{const q=MS.q.trim().toLowerCase();
  let ms=M.filter(m=>(!MS.ty||m.ty===MS.ty)&&(!MS.map||m.map===MS.map)&&(!MS.g||Object.values(m.tm).some(t=>t[0].split(" + ").includes(MS.g)))&&
   (!q||(m.t+" "+m.map+" "+Object.values(m.tm).map(t=>t[0]).join(" ")).toLowerCase().includes(q)||m.r.some(r=>(r[0]||"").toLowerCase().includes(q))));
  const kills=m=>m.r.reduce((a,r)=>a+(r[6]||0),0);
  ms.sort(MS.sort==="old"?(a,b)=>a.date-b.date:MS.sort==="kills"?(a,b)=>kills(b)-kills(a):(a,b)=>b.date-a.date||b.i-a.i);
  let html="",cur=null,inGrid=false;
  ms.forEach(m=>{if(MS.sort!=="kills"){const ym=m.d?m.date.toLocaleDateString("en-US",{month:"long",year:"numeric"}):"Undated";
    if(ym!==cur){if(inGrid)html+="</div>";html+=`<div class="month">${esc(ym)}</div><div class="grid">`;cur=ym;inGrid=true}}else if(!inGrid){html+=`<div class="grid">`;inGrid=true}
   html+=card(m)});
  if(inGrid)html+="</div>";
  $("#ml").innerHTML=html||`<p class="empty">No match fits these filters.</p>`;$("#ml").classList.toggle("picking",MS.pick);fab()};
 const fab=()=>{let f=$("#fab");if(!MS.pick||!MS.sel.size){f&&f.remove();return}
  if(!f){f=document.createElement("div");f.id="fab";f.className="fab";document.body.append(f)}
  f.innerHTML=`<span>${MS.sel.size} game${MS.sel.size===1?"":"s"} picked</span><button class="go">Merge into one leaderboard →</button><button class="x">Clear</button>`;
  f.querySelector(".go").onclick=()=>{location.hash="#/compare/"+new URLSearchParams({g:[...MS.sel].join(","),tab:"merge"}).toString();f.remove()};
  f.querySelector(".x").onclick=()=>{MS.sel.clear();draw()}};
 $("#mpick").onclick=()=>{MS.pick=!MS.pick;$("#mpick").textContent=MS.pick?"Done picking":"Merge games…";$("#mpick").classList.toggle("on",MS.pick);draw()};
 $("#ml").onclick=e=>{if(!MS.pick)return;const c=e.target.closest(".card");if(!c)return;e.preventDefault();const id=c.dataset.id;MS.sel.has(id)?MS.sel.delete(id):MS.sel.add(id);c.classList.toggle("picked",MS.sel.has(id));fab()};
