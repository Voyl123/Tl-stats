 <div><div class="bar"><div class="seg" id="ctab"><button data-v="merge" class="${CS.tab==="merge"?"on":""}">Merged leaderboard</button><button data-v="roster" class="${CS.tab==="roster"?"on":""}">Roster compare</button></div>
 <button class="chip" id="clink" title="Copy a link to exactly this view">Copy link</button></div><div id="cout"></div></div></div>`;
 const drawPick=()=>{const q=CS.q.trim().toLowerCase();const shown=games.filter(m=>!q||(m.t+" "+m.map+" "+m.d+" "+Object.values(m.tm).map(t=>t[0]).join(" ")).toLowerCase().includes(q));
  $("#cpl").innerHTML=shown.map(m=>`<label><input type="checkbox" data-id="${esc(m.id)}"${CS.sel.has(m.id)?" checked":""}><span style="flex:1;min-width:0">${esc(m.t)}<small>${esc(dateTxt(m))}${m.map?" · "+esc(m.map):""} · ${esc(Object.values(m.tm).map(t=>t[0]).join(" vs "))}</small></span>
  <span style="display:flex;flex-direction:column;gap:3px"><button class="chip ab-set" data-side="A" data-g="${esc(m.id)}" title="Roster compare: use as A" style="${CS.A==="game:"+m.id?"border-color:var(--Yellow);color:var(--Yellow)":""}">A</button><button class="chip ab-set" data-side="B" data-g="${esc(m.id)}" title="Roster compare: use as B" style="${CS.B==="game:"+m.id?"border-color:var(--Red);color:var(--Red)":""}">B</button></span></label>`).join("")||`<p class="empty">No games.</p>`;
  $("#ccount").textContent=`${CS.sel.size} picked`;

  $("#cpl").onchange=e=>{const c=e.target;if(!c.dataset.id)return;c.checked?CS.sel.add(c.dataset.id):CS.sel.delete(c.dataset.id);$("#ccount").textContent=`${CS.sel.size} picked`;out()};
  $("#call").onclick=()=>{shown.forEach(m=>CS.sel.add(m.id));drawPick();out()};$("#cnone").onclick=()=>{CS.sel.clear();drawPick();out()}};
 $("#cq").oninput=e=>{CS.q=e.target.value;drawPick()};
 $("#ctab").onclick=e=>{const b=e.target.closest("button");if(!b)return;CS.tab=b.dataset.v;document.querySelectorAll("#ctab button").forEach(x=>x.classList.toggle("on",x===b));out()};

  (navigator.clipboard?navigator.clipboard.writeText(u):Promise.reject()).then(()=>{$("#clink").textContent="Copied ✓"},()=>prompt("Link",u))};
 const out=()=>{if(CS.tab==="merge")outMerge();else outRoster()};
 function outMerge(){const ms=games.filter(m=>CS.sel.has(m.id));

  const A=new Map();ms.forEach(m=>m.r.forEach(r=>{const k=key(r[0]);if(!k)return;let p=A.get(k);if(!p){p={k,n:r[0],gs:{},gh:{},cs:{},rs:{},s:[0,0,0,0,0],g:0,q:[]};A.set(k,p)}

  const rows=[...A.values()].map(p=>({...p,guild:latestG(p.gh),cls:topE(p.cs)[0]?.[0]||"",role:topE(p.rs)[0]?.[0]||"",qa:p.q.length?p.q.reduce((a,b)=>a+b,0)/p.q.length:null}));

  <div class="bar"><div class="seg" id="cmo"><button data-v="t" class="${CS.mode==="t"?"on":""}">Totals</button><button data-v="a" class="${CS.mode==="a"?"on":""}">Per game</button></div></div><div class="tw"><table id="cmt"></table></div>`;
  const draw=()=>{const h=sortable(cols,rows,CS.st);

   bindSort($("#cmt"),CS.st,draw);$("#cmt tbody").onclick=e=>{const tr=e.target.closest("tr[data-k]");if(tr)location.hash="#/player/"+encodeURIComponent(tr.dataset.k)}};
  $("#cmo").onclick=e=>{const b=e.target.closest("button");if(!b)return;CS.mode=b.dataset.v;document.querySelectorAll("#cmo button").forEach(x=>x.classList.toggle("on",x===b));draw()};draw()}
 function outRoster(){
  // a side = "game:<id>" | "guild:<name>" | "picked" , plus an optional guild filter inside a game
  const gl=[...G.keys()].sort((a,b)=>a.localeCompare(b));
  const opt=v=>`<option value="picked"${v==="picked"?" selected":""}>Ticked games (${CS.sel.size})</option><optgroup label="Guild (all its games)">${gl.map(g=>`<option value="guild:${esc(g)}"${v==="guild:"+g?" selected":""}>${esc(g)}</option>`).join("")}</optgroup>
   <optgroup label="One game">${games.map(m=>`<option value="game:${esc(m.id)}"${v==="game:"+m.id?" selected":""}>${esc(dateTxt(m))} · ${esc(m.t)}</option>`).join("")}</optgroup>`;
  if(!CS.A)CS.A=games[1]?"game:"+games[1].id:"picked";if(!CS.B)CS.B=games[0]?"game:"+games[0].id:"picked";
  $("#cout").innerHTML=`<div class="ab" style="margin-bottom:10px"><span class="g" style="margin:0">Quick:</span>
   <select id="rpg"><option value="">Guild's last two games…</option>${gl.filter(g=>G.get(g).ms.size>1).map(g=>`<option>${esc(g)}</option>`).join("")}</select>
   <button class="chip" id="rlast">Latest two games</button><button class="chip" id="rswap">Swap A ⇄ B</button>
   <span class="g">or press A / B next to any game on the left</span></div>
  <div class="ab" style="margin-bottom:6px"><b style="color:var(--Yellow)">A</b><select id="ra">${opt(CS.A)}</select><input id="rga" placeholder="only guild… (optional)" value="${esc(CS.ga)}" style="background:var(--panel);border:1px solid var(--line);border-radius:8px;padding:7px 10px"></div>
  <div class="ab" style="margin-bottom:12px"><b style="color:var(--Red)">B</b><select id="rb">${opt(CS.B)}</select><input id="rgb" placeholder="only guild… (optional)" value="${esc(CS.gb)}" style="background:var(--panel);border:1px solid var(--line);border-radius:8px;padding:7px 10px"></div><div id="rout"></div>`;
  const side=(v,gf)=>{let rs=[];
   if(v==="picked")games.filter(m=>CS.sel.has(m.id)).forEach(m=>m.r.forEach(r=>rs.push([m,r])));
   else if(v.startsWith("game:")){const m=M.find(x=>x.id===v.slice(5));if(m)m.r.forEach(r=>rs.push([m,r]))}
   else if(v.startsWith("guild:")){const g=v.slice(6);M.filter(counted).forEach(m=>m.r.forEach(r=>{if(r[1]===g)rs.push([m,r])}))}
   const f=gf.trim().toLowerCase();if(f)rs=rs.filter(([,r])=>(r[1]||"").toLowerCase().includes(f));
   const o=new Map();rs.forEach(([m,r])=>{const k=key(r[0]);if(!k)return;let p=o.get(k);if(!p){p={k,n:r[0],c:{},g:0,s:[0,0,0,0,0]};o.set(k,p)}p.g++;if(r[3])p.c[r[3]]=(p.c[r[3]]||0)+1;for(let i=0;i<5;i++)p.s[i]+=r[6+i]||0});
   o.forEach(p=>p.cls=topE(p.c)[0]?.[0]||"");return o};
  const draw=()=>{const a=side(CS.A,CS.ga),b=side(CS.B,CS.gb);
   const both=[...a.values()].filter(p=>b.has(p.k)),onlyA=[...a.values()].filter(p=>!b.has(p.k)),onlyB=[...b.values()].filter(p=>!a.has(p.k));
   const li=(p,x)=>`<li>${pLink(p.n)}<span>${esc(p.cls)}${x?" · "+x:""}</span></li>`;
   const pg=(p,i)=>p.s[i]/p.g;
   const swapped=both.filter(p=>a.get(p.k).cls&&b.get(p.k).cls&&a.get(p.k).cls!==b.get(p.k).cls);
   $("#rout").innerHTML=`<div class="stats">${[["In A",a.size],["In B",b.size],["In both",both.length],["Only A",onlyA.length],["Only B",onlyB.length],["Changed class",swapped.length]].map(([l,v])=>`<div class="stat"><b>${v}</b><span>${l}</span></div>`).join("")}</div>
   <div class="ro"><div class="box"><h3 style="color:var(--Yellow)">Only in A · ${onlyA.length}</h3><ul>${onlyA.sort((x,y)=>pg(y,2)-pg(x,2)).map(p=>li(p)).join("")}</ul></div>
   <div class="box"><h3>In both · ${both.length}</h3><ul>${both.sort((x,y)=>pg(b.get(y.k),2)-pg(b.get(x.k),2)).map(p=>{const pa=a.get(p.k),pb=b.get(p.k);const d=pg(pb,2)-pg(pa,2);
     return li(p,(pa.cls!==pb.cls&&pa.cls&&pb.cls?`${esc(pa.cls)} → ${esc(pb.cls)} · `:"")+`<b style="color:${d>=0?"var(--Green)":"var(--Red)"}">${d>=0?"+":"−"}${sh(Math.abs(d))}</b> dmg/game`)}).join("")}</ul></div>
   <div class="box"><h3 style="color:var(--Red)">Only in B · ${onlyB.length}</h3><ul>${onlyB.sort((x,y)=>pg(y,2)-pg(x,2)).map(p=>li(p)).join("")}</ul></div></div>
   <h2>Classes</h2>${(()=>{const cc=o=>{const c={};o.forEach(p=>{if(p.cls)c[p.cls]=(c[p.cls]||0)+1});return c};const ca=cc(a),cb=cc(b);
     const role=c=>{const r={Tank:0,Support:0,DPS:0};M.forEach(m=>m.r.forEach(x=>{}));return r};
     const rl=o=>{const r={Tank:0,Support:0,DPS:0};o.forEach(p=>{const rr=(P.get(p.k)||{}).role;if(r[rr]!=null)r[rr]++});return r};const ra=rl(a),rb=rl(b);
     const ks=[...new Set([...Object.keys(ca),...Object.keys(cb)])].sort((x,y)=>((cb[y]||0)+(ca[y]||0))-((cb[x]||0)+(ca[x]||0)));
     return`<div class="stats">${["Tank","Support","DPS"].map(r=>`<div class="stat"><b>${ra[r]} → ${rb[r]}</b><span>${roleDot(r)}${r}</span></div>`).join("")}</div>
     <div class="tw"><table><thead><tr><th class="l">Class</th><th style="color:var(--Yellow)">A</th><th style="color:var(--Red)">B</th><th>Change</th></tr></thead><tbody>${ks.map(c=>{const x=ca[c]||0,y=cb[c]||0,d=y-x;
      return`<tr><td class="l">${esc(c)}</td><td>${x||"<span class=g>–</span>"}</td><td>${y||"<span class=g>–</span>"}</td><td style="color:${d>0?"var(--Green)":d<0?"var(--Red)":"var(--faint)"}">${d>0?"+":""}${d||"="}</td></tr>`}).join("")}</tbody></table></div>`})()}
   <p class="hint" style="margin-top:10px">Lists sorted by damage per game. "In both" shows the change in damage per game from A to B, and class swaps.</p>`};
  $("#ra").onchange=e=>{CS.A=e.target.value;draw()};$("#rb").onchange=e=>{CS.B=e.target.value;draw()};
  $("#rpg").onchange=e=>{const g=e.target.value;if(!g)return;const ms=[...G.get(g).ms].map(i=>M[i]).sort((a,b)=>b.date-a.date);
   if(ms.length>1){CS.A="game:"+ms[1].id;CS.B="game:"+ms[0].id;CS.ga=CS.gb=g;outRoster();drawPick()}};
  $("#rlast").onclick=()=>{CS.A="game:"+games[1].id;CS.B="game:"+games[0].id;CS.ga=CS.gb="";outRoster();drawPick()};
  $("#rswap").onclick=()=>{[CS.A,CS.B]=[CS.B,CS.A];[CS.ga,CS.gb]=[CS.gb,CS.ga];outRoster();drawPick()};
  $("#rga").oninput=e=>{CS.ga=e.target.value;draw()};$("#rgb").oninput=e=>{CS.gb=e.target.value;draw()};draw()}
 drawPick();out()}

/* ---------------- search everywhere ---------------- */
const gq=$("#gq"),dd=$("#dd");let hits=[],sel=-1;
function search(q){q=q.trim().toLowerCase();if(!q){dd.classList.remove("on");return}
 const ak=k=>((D.aka||{})[k]||[]).join(" ").toLowerCase();
 const ps=[...P.values()].filter(p=>p.n.toLowerCase().includes(q)||ak(p.k).includes(q)).sort((a,b)=>(a.n.toLowerCase().startsWith(q)?0:1)-(b.n.toLowerCase().startsWith(q)?0:1)||b.g-a.g).slice(0,8);
 const gs=[...G.values()].filter(g=>g.n.toLowerCase().includes(q)).sort((a,b)=>b.ms.size-a.ms.size).slice(0,5);
 const ms=M.filter(m=>(m.t+" "+m.map+" "+m.d).toLowerCase().includes(q)).sort((a,b)=>b.date-a.date).slice(0,6);
 hits=[...ps.map(p=>({h:`${ROOT}#/player/${encodeURIComponent(p.k)}`,t:p.n+(ak(p.k)?` (was ${(D.aka[p.k]||[]).join(", ")})`:""),s:`${p.cls||""} · ${p.guild||""} · ${p.g} games`,grp:"Players"})),
  ...gs.map(g=>({h:`${ROOT}#/guild/${encodeURIComponent(g.n)}`,t:g.n,s:`${g.ps.size} players · ${g.ms.size} matches`,grp:"Guilds"})),
  ...ms.map(m=>({h:mHref(m),t:m.t,s:dateTxt(m),grp:"Matches"}))];
 sel=-1;let last="";
 dd.innerHTML=hits.map((x,i)=>(x.grp!==last?`<h6>${(last=x.grp)}</h6>`:"")+`<a href="${esc(x.h)}" data-i="${i}">${esc(x.t)}<span>${esc(x.s)}</span></a>`).join("")||`<h6>Nothing found</h6>`;
 dd.classList.add("on")}
gq.oninput=()=>search(gq.value);gq.onfocus=()=>gq.value&&search(gq.value);
gq.onkeydown=e=>{const as=[...dd.querySelectorAll("a")];if(e.key==="ArrowDown"||e.key==="ArrowUp"){e.preventDefault();sel=Math.max(0,Math.min(as.length-1,sel+(e.key==="ArrowDown"?1:-1)));as.forEach((a,i)=>a.classList.toggle("k",i===sel))}
 else if(e.key==="Enter"){const a=as[sel>=0?sel:0];if(a){location.href=a.getAttribute("href");dd.classList.remove("on");gq.blur()}}else if(e.key==="Escape"){dd.classList.remove("on");gq.blur()}};
document.addEventListener("click",e=>{if(!e.target.closest(".gs"))dd.classList.remove("on");else if(e.target.closest(".dd a"))dd.classList.remove("on")});
document.addEventListener("keydown",e=>{if(e.key==="/"&&document.activeElement.tagName!=="INPUT"){e.preventDefault();gq.focus()}});

function route(){const f=$("#fab");if(f&&!location.hash.match(/^#\/?$/))f.remove();const h=decodeURIComponent(location.hash.replace(/^#\/?/,""));const [v,...rest]=h.split("/");const arg=rest.join("/");
 const view=v||"players";document.querySelectorAll("nav a").forEach(a=>a.classList.toggle("on",a.dataset.v===(view==="player"?"players":view==="guild"?"guilds":view)));
 if(view==="players")vPlayers();else if(view==="player")vPlayer(arg);else if(view==="guilds")vGuilds();else if(view==="guild")vGuild(arg);else if(view==="leaders")vLeaders();else if(view==="parses")vParses();else if(view==="compare")vCompare(arg);else vMatches();
 document.title=(view==="player"&&P.get(arg)?P.get(arg).n+" · ":view==="guild"&&arg?arg+" · ":view==="leaders"?"Leaderboards · ":view!=="matches"&&view!==""?view[0].toUpperCase()+view.slice(1)+" · ":"")+D.title;
 window.scrollTo(0,0)}
addEventListener("hashchange",route);route();
